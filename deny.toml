[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

# Kept in sync with .cargo/audit.toml — see that file for the full reachability
# analysis. Both entries are quick-xml DoS advisories. Since the 30.08.2026
# `cargo update` only ONE affected path remains: quick-xml 0.38.4 through
# typst's CSL bibliography parser, which is never fed user input. citationberg
# pins ^0.38, so `cargo update` cannot resolve it. The formerly listed
# wayland-scanner path now resolves to the patched quick-xml 0.41.
ignore = [
    "RUSTSEC-2026-0194",  # quick-xml: quadratic duplicate-attribute check
    "RUSTSEC-2026-0195",  # quick-xml: unbounded namespace allocation (DoS)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

skip = [
    # crossterm: 0.28.1 pinned for tui-textarea compatibility (DEP-01); 0.29 pulled by other deps
    { name = "crossterm", version = "=0.29.0" },

    # comemo 0.4 (required by typst 0.14 World trait) vs 0.5 (pulled by other typst internals)
    { name = "comemo", version = "=0.5.1" },
    { name = "comemo-macros", version = "=0.5.1" },

    # bitflags 1.x (legacy transitive dep) vs 2.x (modern)
    { name = "bitflags", version = "=1.3.2" },

    # windows-*: multiple versions pulled by different transitive deps (nix,
    # rustix, tokio, etc.). Never built here — the project targets Linux and
    # macOS — but cargo-deny checks all targets, so the duplicates surface.
    # Regenerated from Cargo.lock on 30.08.2026; the 0.48.x line dropped out of
    # the tree entirely and 0.53.x/0.61.x came in. If keeping this list in sync
    # after every `cargo update` becomes tedious, drop the `version` field and
    # skip these crates wholesale.
    { name = "windows-link", version = "=0.2.1" },
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-sys", version = "=0.60.2" },
    { name = "windows-sys", version = "=0.61.2" },
    { name = "windows-targets", version = "=0.52.6" },
    { name = "windows-targets", version = "=0.53.5" },
    { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "=0.53.1" },
    { name = "windows_aarch64_msvc", version = "=0.52.6" },
    { name = "windows_aarch64_msvc", version = "=0.53.1" },
    { name = "windows_i686_gnu", version = "=0.52.6" },
    { name = "windows_i686_gnu", version = "=0.53.1" },
    { name = "windows_i686_gnullvm", version = "=0.52.6" },
    { name = "windows_i686_gnullvm", version = "=0.53.1" },
    { name = "windows_i686_msvc", version = "=0.52.6" },
    { name = "windows_i686_msvc", version = "=0.53.1" },
    { name = "windows_x86_64_gnu", version = "=0.52.6" },
    { name = "windows_x86_64_gnu", version = "=0.53.1" },
    { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "=0.53.1" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.53.1" },

    # Remaining ecosystem churn — typst + ICU + syntect + various transitive deps
    # all at "warn" level (multiple-versions = "warn"), not hard "deny"
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
